<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>B8-2F 互動住宅模型</title>
  <style>html,body{margin:0;min-height:100%;background:#f7f7f3;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}#loading{padding:24px;color:#555}</style>
</head>
<body>
  <div id="loading">模型載入中…</div>
  <script>
  (async()=>{
    const parts=[];
    for(let i=0;i<4;i++){
      const r=await fetch("./model-"+String(i).padStart(2,"0")+".txt",{cache:"no-store"});
      if(!r.ok) throw new Error("模型分段載入失敗 "+(i+1));
      parts.push(await r.text());
    }
    const html=parts.join("");
    document.open();
    document.write(html);
    document.close();
  })().catch(err=>{
    document.getElementById("loading").textContent="模型載入失敗，請重新整理；"+err.message;
  });
  </script>
</body>
</html>
